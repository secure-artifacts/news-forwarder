[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "international-news-forwarder"
version = "1.2.1"
description = "Collect, summarize, translate, and forward international news to Google Sheets and Microsoft Teams."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "google-api-python-client==2.199.0",
  "google-auth==2.40.3",
  "httpx==0.28.1",
  "PyYAML==6.0.2",
  "python-dateutil==2.9.0.post0",
  "python-multipart==0.0.20",
  "tzdata==2025.2",
]

[project.scripts]
news-forwarder = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html"]
