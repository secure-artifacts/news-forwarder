app:
  timezone: Europe/Lisbon
  schedule_hour: 8
  schedule_minute: 0
  database_path: data/news.db
  max_age_hours: 36
  max_articles_per_country: 30
translation:
  enabled: true
  provider: local_llama
  model: translategemma-4b
  base_url: http://127.0.0.1:11435
  source_language: Portuguese
  source_code: pt
  key_points_only: true
destinations:
  automatic_delivery: false
  teams:
    enabled: false
    payload_mode: adaptive_card
    max_articles_per_message: 8
  google_sheets:
    enabled: true
    worksheet_name: News
source_policy:
  require_https: true
  allowed_domains: []
  blocked_domain_suffixes:
  - .cn
  - xinhuanet.com
  - people.com.cn
  - chinadaily.com.cn
  - cgtn.com
  - globaltimes.cn
  - china.com.cn
  - cctv.com
  blocked_source_words:
  - 新华
  - 人民日报
  - 中国日报
  - 环球时报
  - 央视
  - CGTN
  - Xinhua
