<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>社交平台动态 · 国际新闻转发器</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#0f1d30;--line:#203650;--text:#edf5ff;--muted:#91a8c4;--cyan:#55d9d2;--orange:#ffb35b}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 18% 0,#153957 0,transparent 38%),var(--bg);color:var(--text)}
    main{width:min(1250px,calc(100% - 32px));margin:auto;padding:38px 0 70px}header,.actions,.item-head,.meta{display:flex;align-items:center;gap:12px}header{justify-content:space-between;margin-bottom:25px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:15px}.app-logo{width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 8px 18px #00d9ff3d)}h1{margin:0;font-size:clamp(30px,5vw,50px)}.sub,.meta,.empty{color:var(--muted)}.sub{margin:7px 0 0}.nav a,button{border:1px solid var(--line);border-radius:11px;padding:11px 16px;color:var(--text);background:#132943;text-decoration:none;font-weight:750;cursor:pointer}.nav{display:flex;gap:10px}.primary{background:var(--cyan);color:#05211e;border-color:transparent}.orange{background:var(--orange);color:#271604;border-color:transparent}button:disabled{opacity:.5;cursor:wait}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:17px}.card,.toolbar,.item{background:#0f1d30e8;border:1px solid var(--line);border-radius:16px}.card{padding:19px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.value{font-size:27px;font-weight:850;margin-top:7px}.toolbar{padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.items{display:grid;gap:13px}.item{padding:19px}.item-head{justify-content:space-between;align-items:flex-start}.platform{color:var(--cyan);font-weight:850}.meta{font-size:12px;flex-wrap:wrap}.item h2{font-size:18px;margin:13px 0 8px}.item p{line-height:1.68;color:#c9d8e9;margin:0 0 13px;white-space:pre-wrap}.item-actions{display:flex;gap:9px;flex-wrap:wrap}.item-actions a,.item-actions button{font-size:12px;padding:8px 11px}.empty{text-align:center;padding:55px;border:1px dashed var(--line);border-radius:15px}.toast{position:fixed;right:25px;bottom:25px;background:#173a43;border:1px solid var(--cyan);padding:13px 17px;border-radius:11px;display:none;z-index:5}.status-running{color:var(--orange)}
    @media(max-width:700px){.summary{grid-template-columns:1fr}.item-head{display:block}.meta{margin-top:8px}.actions{width:100%;flex-wrap:wrap}.actions button{flex:1}}
  </style>
</head>
<body><main>
  <header><div class="brand"><img class="app-logo" src="/static/logo.png" alt="国际新闻转发器 Logo"><div><h1>社交平台动态</h1><p class="sub">公开政策、资料与平台更新 · 不限制国家和地区</p></div></div><div class="nav"><a href="/">新闻主页</a><a href="/settings">设置</a></div></header>
  <section class="summary">
    <div class="card"><div class="label">已收集</div><div class="value" id="total">0</div></div>
    <div class="card"><div class="label">待写入工作表</div><div class="value" id="pending">0</div></div>
    <div class="card"><div class="label">定期更新</div><div class="value" id="schedule">—</div></div>
  </section>
  <section class="toolbar"><div id="state">等待任务</div><div class="actions"><button class="primary" id="run" onclick="runNow()">立即采集并整理</button><button onclick="copyAll()">一键复制全部</button><button class="orange" id="send" onclick="sendSheets()">写入社交动态工作表</button></div></section>
  <section class="items" id="items"><div class="empty">尚无社交平台动态</div></section>
</main><div class="toast" id="toast"></div>
<script>
  let current=[],tokenRequired=false,refreshing=false;
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const dateText=v=>v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'时间未知';
  function copyText(item){return `【${item.platform_name}】${item.title_zh||item.title}\n贴文/发布时间：${dateText(item.published_at)}\n内容简介：${item.summary_zh||item.summary||'暂无简介'}\n来源：${item.source||item.platform_name}\n链接：${item.url}`}
  async function writeClipboard(text){try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}}
  async function copyOne(id){const item=current.find(x=>x.id===id);if(!item)return;await writeClipboard(copyText(item));toast('已复制该条内容、时间和链接')}
  async function copyAll(){if(!current.length){toast('当前没有可复制的内容');return}await writeClipboard(current.map(copyText).join('\n\n--------------------\n\n'));toast(`已复制全部 ${current.length} 条`) }
  function auth(){if(!tokenRequired)return '';token=localStorage.getItem('news-admin-token')||(prompt('请输入管理令牌：')||'');if(token)localStorage.setItem('news-admin-token',token);return token}
  function toast(text){const box=document.getElementById('toast');box.textContent=text;box.style.display='block';setTimeout(()=>box.style.display='none',3500)}
  async function refresh(){if(refreshing)return;refreshing=true;try{const data=await fetch('/api/social/status').then(r=>r.json());current=data.items||[];tokenRequired=data.config.token_required;document.getElementById('total').textContent=data.stats.total||0;document.getElementById('pending').textContent=data.stats.sheets_pending||0;document.getElementById('schedule').textContent=data.config.enabled?`每 ${data.config.interval_minutes} 分钟`:'已停用';document.getElementById('state').innerHTML=data.running?'<span class="status-running">正在处理，请稍候…</span>':`目标工作表：${esc(data.config.worksheet_name)}`;document.getElementById('run').disabled=data.running;document.getElementById('send').disabled=data.running||!data.config.sheets_ready;document.getElementById('items').innerHTML=current.length?current.map(item=>`<article class="item"><div class="item-head"><div class="platform">${esc(item.platform_name)}</div><div class="meta"><span>贴文/发布时间：${esc(dateText(item.published_at))}</span><span>采集：${esc(dateText(item.collected_at))}</span></div></div><h2>${esc(item.title_zh||item.title)}</h2><p>${esc(item.summary_zh||item.summary||'暂无简介')}</p><div class="item-actions"><button onclick="copyOne(${item.id})">复制本条</button><a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">打开来源 ↗</a><span class="meta">${esc(item.source)} · Sheet ${item.sheets_sent?'✓':'待写入'}</span></div></article>`).join(''):'<div class="empty">尚无数据，点击“立即采集并整理”开始。</div>'}catch(e){}finally{refreshing=false}}
  async function runNow(){const r=await fetch('/api/social/run',{method:'POST',headers:{'X-Admin-Token':auth()}});const d=await r.json();toast(d.message||d.detail);refresh()}
  async function sendSheets(){const b=document.getElementById('send');b.disabled=true;b.textContent='写入中…';try{const r=await fetch('/api/social/send-sheets',{method:'POST',headers:{'X-Admin-Token':auth()}});const d=await r.json();toast(d.message||d.detail)}finally{b.textContent='写入社交动态工作表';refresh()}}
  refresh();setInterval(refresh,2500);
</script></body></html>
